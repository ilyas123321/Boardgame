name: CI and CD pipeline

on:
  push:
    branches: [ "main" ]
    
jobs:
  build:

    runs-on: self-hosted

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
        check-latest: false
        server-id: github
        settings-path: ${{ github.workspace }}
        overwrite-settings: false
        
    - name: Build with Maven
      run: mvn package --file pom.xml

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: sample-artifact  # Artifact name
        path: target/*.jar  # Path to the directory or file to upload
        retention-days: 7  # Keep the artifact for 7 days (default is 90)

    - name: Run Trivy FS Scan
      run: |
        mkdir -p trivy-results
        trivy fs --exit-code 0 --format table --output trivy-results/trivy-fs-report.txt .

    - name: Upload Trivy Scan Report
      uses: actions/upload-artifact@v4
      with:
        name: trivy-fs-report
        path: trivy-results/trivy-fs-report.txt
        retention-days: 7    
        
    - name: install jq  
      run: sudo apt-get update && sudo apt-get install -y jq

    - name: Install Unzip
      run: sudo apt-get update && sudo apt-get install -y unzip
      
    - name: SonarQube Scan
      uses: sonarsource/sonarqube-scan-action@master
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        SONAR_HOST_URL: ${{secrets.SONAR_HOST_URL }}

    - name: SonarQube Quality Gate Check
      id: quality-gate-test
      uses: sonarsource/sonarqube-quality-gate-action@master
      timeout-minutes: 5
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        SONAR_HOST_URL: ${{secrets.SONAR_HOST_URL }}


    - name: Setup QEMU
      uses: docker/setup-qemu-action@v3

    - name: Setup Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker Image
      run: |
        docker build -t ilyas123321/boardgame:latest .

    - name: Trivy Image Scan
      run: |
        trivy image --format table -o trivy-image-report.html ilyas123321/boardgame:latest

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Push Docker Image
      run: |
        docker push ilyas123321/boardgame:latest


        

   
