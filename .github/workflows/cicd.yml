name: CI and CD pipeline

on:
  push:
    branches: [ "main" ]
    
jobs:
  build:

    runs-on: self-hosted

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
        check-latest: false
        server-id: github
        settings-path: ${{ github.workspace }}
        overwrite-settings: false
        
    - name: Build with Maven
      run: mvn package --file pom.xml

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: sample-artifact  # Artifact name
        path: target/*.jar  # Path to the directory or file to upload
        retention-days: 7  # Keep the artifact for 7 days (default is 90)

    - name: Run Trivy FS Scan
      run: |
        mkdir -p trivy-results
        trivy fs --exit-code 0 --format table --output trivy-results/trivy-fs-report.txt .

    - name: Upload Trivy Scan Report
      uses: actions/upload-artifact@v4
      with:
        name: trivy-fs-report
        path: trivy-results/trivy-fs-report.txt
        retention-days: 7    
        
